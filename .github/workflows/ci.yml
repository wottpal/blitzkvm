# The same steps as `make check`. Pushes to main run it only while the
# repository is public (macOS minutes are billed on private repositories);
# pull requests and manual runs always do. macOS 26 provides the SDK the app
# needs (Liquid Glass, Icon Composer).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (macOS)
    if: github.event_name != 'push' || !github.event.repository.private
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Generated code is up to date
        run: make generate-check

      - name: Test (race)
        run: go test -race -p 1 -count=1 ./...

      - name: Test (timing-sensitive, skipped under race)
        run: make test-timing

      - name: Test vendored openh264 module
        working-directory: third_party/openh264-go
        run: go test -count=1 ./...

      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Native app (Swift)
        run: make -C macos test

      # Unsigned; JetKVM's own firmware is downloaded, the BlitzKVM build is left out.
      - name: Native app (bundle)
        run: make -C macos app SIGN_IDENTITY=- COPY_TO=
