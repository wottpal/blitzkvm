# The same steps as `make check`. Pushes to main run it only while the
# repository is public (macOS minutes are billed on private repositories);
# pull requests and manual runs always do. macOS 26 provides the SDK the app
# needs (Liquid Glass, Icon Composer).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (macOS)
    if: github.event_name != 'push' || !github.event.repository.private
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Generated code is up to date
        run: make generate-check

      - name: Test (race)
        run: go test -race -p 1 -count=1 ./...

      - name: Test (timing-sensitive, skipped under race)
        run: make test-timing

      - name: Test vendored openh264 module
        working-directory: third_party/openh264-go
        run: go test -count=1 ./...

      # The firmware builds this module with its own Go (1.25): keep it there.
      - name: Test approval module (the firmware's Go)
        working-directory: approval
        env:
          GOTOOLCHAIN: go1.25.1
        run: go vet ./... && go test -race -count=1 ./...

      - name: ApprovalKit (Swift)
        run: swift test --package-path apple/ApprovalKit

      - name: Remote side (Swift, PAM shim)
        run: swift test --package-path remote/blitzkvm-remote && make -C remote/pam test

      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Native app (Swift)
        run: make -C macos test

      # Unsigned; JetKVM's own firmware is downloaded, the BlitzKVM build is left out.
      - name: Native app (bundle)
        run: make -C macos app SIGN_IDENTITY=- COPY_TO=

  relay:
    name: Relay (Cloudflare Worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
